<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 분석 검수</title>
<style>body{font:15px/1.6 system-ui,sans-serif;margin:24px;color:#20243a;background:#f7f8fc}h1{font-size:25px}button,input,select,textarea{font:inherit;padding:7px}button{cursor:pointer}label{display:inline-flex;gap:8px;align-items:center;margin:6px}button:disabled{opacity:.5;cursor:default}.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(400px,1.4fr);gap:20px}img{max-width:100%;height:auto}.original{max-height:80vh;overflow:auto;background:white}fieldset{border:1px solid #d9dceb;background:white;margin:16px 0}table{border-collapse:collapse;background:white}td,th{border:1px solid #d9dceb;padding:5px}td input{width:110px}textarea{width:95%;min-height:65px}.overflow{overflow:auto}#status{white-space:pre-wrap}#headers{display:grid;grid-template-columns:1fr 1fr}#headers label{display:block}#headers input{width:90%}@media(max-width:800px){.layout{display:block}#headers{display:block}}</style></head><body>
<h1>GPT 사진 분석 · 사람 최종 검수</h1><p>원본과 모든 행을 비교한 뒤 확인 저장하세요. 수령 연결·수정 청구 합의·정산 승인은 별도입니다.</p>
<label>세션 토큰 <input id="session" type="password"></label><button id="connect">점포 불러오기</button>
<fieldset><legend>저장할 범위</legend><label>점포 <select id="store"></select></label><label>거래처 <select id="supplier"></select></label><label>기간 <select id="period"></select></label><label>검수자 <input id="actor" maxlength="100" value="검수 점주"></label></fieldset>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp"><button id="analyze">사진 분석</button><p id="status" role="status" aria-live="polite">사진을 선택하세요.</p>
<div class="layout"><div class="original"><a id="originalLink" target="_blank" rel="noopener"><img id="original" alt="검수할 원본 사진"></a></div><section id="editor" hidden><label>문서 종류 <select id="type"><option>UNKNOWN</option><option>DELIVERY</option><option>RECEIPT</option><option>INVOICE</option><option>CORRECTED_INVOICE</option></select></label><div id="headers"></div><div class="overflow"><table><thead><tr id="columns"></tr></thead><tbody id="lines"></tbody></table></div><button id="add">행 추가</button><p>빈칸은 미확인(null)입니다. 0은 숫자 0을 입력하세요. 금액은 원본에 적힌 값을 사용합니다.</p><label><input type="checkbox" id="checked">원본·범위·모든 행을 검수했습니다.</label><button id="save">검수 확인 저장</button></section></div>
<script>
const $=id=>document.getElementById(id);
const keys=['delivery_date','delivery_no','item','spec','unit','qty_read','unit_price_read','amount_read','tax_amount_read','line_date_text','item_code','origin','lot_no','line_note','supply_amount_read','discount_amount_read','line_total_read'];
const names=['납품일','명세번호','품목','규격','단위','수량','단가','기재 금액','세액','품목 날짜 원문','품목코드','원산지','로트번호','비고','공급가액','할인액','합계금액'];
const amountLabels={"supply_total": "공급가액 합계", "tax_total": "세액 합계", "document_total": "문서 합계금액", "previous_balance": "전잔액", "balance_after_dispatch": "전잔액 + 출고액", "deposit_amount": "입금액", "current_balance": "현잔액"};
const headers={...amountLabels,store_name_read:'공급받는 점포',trade_date:'거래일',issued_on:'발행일',quoted_on:'견적일',source_date_text:'원본 날짜 표기',supplier_name_read:'공급처 원문',doc_no:'문서번호',doc_date:'문서일',period_start:'정산 시작',period_end:'정산 끝',payment_due_on:'지급일',replaces_doc_no:'대체 청구번호',agreement_text:'합의 문구 원문'};
let preview=null,selectedFile=null,sourceUrl=null,pending=null,busy=false;
async function api(path,opts){const r=await fetch(path,{...opts,headers:{...opts?.headers,Authorization:'Bearer '+$('session').value}});const body=await r.json();if(!r.ok)throw Error(JSON.stringify(body.detail??body));return body;}
function options(id,values,idKey,nameKey){$(id).replaceChildren();for(const row of values){const o=document.createElement('option');o.value=row[idKey];o.textContent=row[nameKey];$(id).append(o);}}
function changed(){pending=null;$('checked').checked=false;}
function resetDraft(){preview=null;pending=null;selectedFile=null;$('editor').hidden=true;changed();}
async function loadPeriods(){resetDraft();options('period',[]);if(!$('store').value||!$('supplier').value)return;const p=await api('/api/periods?store_id='+encodeURIComponent($('store').value)+'&supplier_id='+encodeURIComponent($('supplier').value));options('period',p.periods,'period_id','label');}
async function loadSuppliers(){options('supplier',[]);options('period',[]);resetDraft();if(!$('store').value)return;const p=await api('/api/suppliers?store_id='+encodeURIComponent($('store').value));options('supplier',p.suppliers,'id','name');await loadPeriods();}
function addRow(line={},source=null){const tr=document.createElement('tr');tr.dataset.source=source??'';for(const key of keys){const td=document.createElement('td'),input=document.createElement('input');input.dataset.field=key;input.value=line[key]??'';input.setAttribute('aria-label',names[keys.indexOf(key)]);input.addEventListener('input',changed);td.append(input);tr.append(td);}const td=document.createElement('td'),b=document.createElement('button');b.textContent='삭제';b.onclick=()=>{tr.remove();changed();};td.append(b);tr.append(td);$('lines').append(tr);}
function render(){const d=preview.draft;$('type').value=d.doc_type;$('headers').replaceChildren();for(const [key,name] of Object.entries(headers)){const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.id='h-'+key;input.value=d[key]??'';input.addEventListener('input',changed);label.append(input);$('headers').append(label);}$('lines').replaceChildren();d.lines.forEach((r,i)=>addRow(r,i+1));$('editor').hidden=false;changed();}
function review(){const value={doc_type:$('type').value};for(const key of Object.keys(headers)){
 const raw=$('h-'+key).value.trim();
 if(key in amountLabels && raw){
   if(!/^-?\d+$/.test(raw)||!Number.isSafeInteger(Number(raw)))throw Error(amountLabels[key]+'을 원 단위 정수로 입력하세요.');
   value[key]=Number(raw);
 } else value[key]=raw||null;
}value.lines=[...$('lines').children].map(tr=>{const row={source_row:tr.dataset.source?Number(tr.dataset.source):null};for(const input of tr.querySelectorAll('input')){let v=input.value.trim()||null;if(['amount_read','tax_amount_read','supply_amount_read','discount_amount_read','line_total_read'].includes(input.dataset.field)&&v!==null){if(!/^-?\d+$/.test(v)||!Number.isSafeInteger(Number(v)))throw Error('기재 금액은 정수 또는 빈칸이어야 합니다.');v=Number(v);}row[input.dataset.field]=v;}return row;});return value;}
function lock(value){busy=value;for(const id of ['analyze','save','file','store','supplier','period','actor','type','add'])$(id).disabled=value;for(const el of document.querySelectorAll('#editor input,#editor button'))el.disabled=value;}
$('analyze').onclick=async()=>{if(busy)return;resetDraft();const f=$('file').files[0];if(!f){$('status').textContent='사진을 선택하세요.';return;}lock(true);$('status').textContent='사진을 분석하고 있습니다.';try{const fd=new FormData();fd.append('file',f);preview=await api('/api/photo-previews-v2',{method:'POST',body:fd});selectedFile=f;if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(f);$('original').src=sourceUrl;$('originalLink').href=sourceUrl;render();$('status').textContent='분석 초안입니다. 원본과 비교해 수정하세요. 분석만으로 정산에 저장되지 않습니다.';}catch(e){resetDraft();$('status').textContent=e.message;}finally{lock(false);}};
$('save').onclick=async()=>{if(busy||!preview)return;if(!$('checked').checked){$('status').textContent='원본 비교 검수 여부를 체크하세요.';return;}lock(true);try{if(!pending){if(!$('period').value)throw Error('저장할 점포·거래처·기간을 선택하세요.');const state=await api('/api/periods/'+encodeURIComponent($('period').value)+'/review-context');const fd=new FormData();fd.append('file',selectedFile);fd.append('draft_json',JSON.stringify(preview.draft));fd.append('review_json',JSON.stringify(review()));fd.append('signature',preview.signature);fd.append('issued_at',String(preview.issued_at));for(const [key,id] of [['store_id','store'],['supplier_id','supplier'],['period_id','period'],['actor_label','actor']])fd.append(key,$(id).value);fd.append('expected_revision',String(state.input_revision));fd.append('request_key',crypto.randomUUID());pending=fd;}const saved=await api('/api/photo-previews-v2/confirm',{method:'POST',body:pending});$('status').textContent='검수 확인 저장 완료: '+saved.document_id+'\n수령 연결·대체 합의·정산 승인은 별도 확인이 필요합니다.';resetDraft();}catch(e){$('status').textContent=e.message+'\n네트워크 실패 시 같은 내용으로 재시도할 수 있습니다. 버전 충돌 시 범위를 다시 선택하고 재검수하세요.';}finally{lock(false);}};
$('file').onchange=resetDraft;$('store').onchange=()=>loadSuppliers().catch(e=>$('status').textContent=e.message);$('supplier').onchange=()=>loadPeriods().catch(e=>$('status').textContent=e.message);$('period').onchange=resetDraft;$('type').onchange=changed;$('actor').oninput=changed;$('add').onclick=()=>{addRow();changed();};
for(const name of [...names,'행 삭제']){const th=document.createElement('th');th.textContent=name;$('columns').append(th);}
$('connect').onclick=()=>{resetDraft();api('/api/stores').then(p=>{options('store',p.stores,'id','name');return loadSuppliers();}).catch(e=>$('status').textContent=e.message);};$('session').oninput=()=>{resetDraft();options('store',[]);options('supplier',[]);options('period',[]);};
</script></body></html>
