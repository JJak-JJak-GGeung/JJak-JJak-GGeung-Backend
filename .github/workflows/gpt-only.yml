name: GPT-only extraction
on:
  pull_request:
  push:
    branches: [feat/gpt-document-extraction]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check GPT-only path, review API and calculation regression
        run: python -m pytest app/photo app/reconcile tests/test_photo_review.py -q
